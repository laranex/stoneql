<!doctype html>
<html><head><meta charset="utf-8"><style>
/* Original StoneQL installer background (660 x 400 pt). Finder places StoneQL.app at (165, 205)
   and the Applications shortcut at (495, 205); icons are 112 pt. */
html,body{margin:0;width:660px;height:400px;overflow:hidden}
body{font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:#1d2a3a;
  background:radial-gradient(120% 95% at 50% 0%,#ffffff 0%,#eef2f7 55%,#dfe6ee 100%)}
svg.facets{position:absolute;inset:0}
.brand{position:absolute;top:30px;left:0;right:0;text-align:center}
.brand h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.5px}
.brand h1 span{color:#2f6db5}
.brand p{margin:6px 0 0;font-size:13px;color:#5b6b7f;letter-spacing:.3px}
.slot{position:absolute;top:139px;width:132px;height:132px;border-radius:30px;
  background:rgba(255,255,255,.65);border:1px solid rgba(60,90,130,.16);
  box-shadow:0 1px 2px rgba(20,40,70,.06)}
.slot.app{left:99px}.slot.apps{left:429px}
.arrow{position:absolute;top:186px;left:256px;width:148px;height:38px}
.hint{position:absolute;bottom:26px;left:0;right:0;text-align:center}
.hint strong{display:block;font-size:16px;font-weight:600;color:#1d2a3a}
.hint span{display:block;margin-top:5px;font-size:12px;color:#5b6b7f}
</style></head><body>
<svg class="facets" viewBox="0 0 660 400" aria-hidden="true">
  <g fill="none" stroke="rgba(60,90,130,.10)" stroke-width="1">
    <polygon points="0,400 70,318 150,360 120,400"/><polygon points="70,318 0,250 0,400"/>
    <polygon points="150,360 70,318 160,300"/><polygon points="660,400 590,322 515,368 545,400"/>
    <polygon points="590,322 660,262 660,400"/><polygon points="515,368 590,322 500,300"/>
    <polygon points="0,0 60,0 0,70"/><polygon points="660,0 600,0 660,64"/>
  </g>
  <g fill="rgba(60,90,130,.045)">
    <polygon points="0,400 70,318 150,360 120,400"/><polygon points="660,400 590,322 515,368 545,400"/>
  </g>
</svg>
<div class="brand"><h1>Stone<span>QL</span></h1><p>Old habits. New engine.</p></div>
<div class="slot app"></div><div class="slot apps"></div>
<svg class="arrow" viewBox="0 0 148 38" aria-hidden="true">
  <defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="148" y2="0"><stop offset="0" stop-color="#2f6db5" stop-opacity=".2"/><stop offset="1" stop-color="#2f6db5"/></linearGradient></defs>
  <path d="M8 19 H130" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
  <path d="M120 7 L140 19 L120 31" fill="none" stroke="#2f6db5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<div class="hint"><strong>Drag StoneQL onto Applications to install</strong><span>Then open StoneQL from your Applications folder.</span></div>
</body></html>
