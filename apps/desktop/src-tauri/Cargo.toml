[package]
name = "stoneql-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "stoneql_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
stoneql-runtime = { path = "../../../crates/stoneql-runtime" }
tauri = "=2.12.5"
tauri-plugin-dialog = "=2.8.3"
stoneql-core = { path = "../../../crates/stoneql-core" }
stoneql-contracts = { path = "../../../crates/stoneql-contracts" }
serde_json.workspace = true
serde.workspace = true
uuid.workspace = true

# D005 desktop secret provider: macOS Keychain only; other OSes are explicitly unsupported.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", default-features = false }

[dev-dependencies]
sqlx.workspace = true
tauri = { version = "=2.12.5", features = ["test"] }

[build-dependencies]
tauri-build = "=2.7.4"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true

# Opens a real window; runs only with STONEQL_REAL_WINDOW=1 (see the file header).
[[test]]
name = "real_window_reload"
harness = false
