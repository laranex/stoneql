[package]
name = "dbadmin-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "dbadmin_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
dbadmin-runtime = { path = "../../../crates/dbadmin-runtime" }
tauri = "=2.12.5"
tauri-plugin-dialog = "=2.8.3"
dbadmin-core = { path = "../../../crates/dbadmin-core" }
dbadmin-contracts = { path = "../../../crates/dbadmin-contracts" }
serde_json.workspace = true
serde.workspace = true
uuid.workspace = true

[dev-dependencies]
sqlx.workspace = true
tauri = { version = "=2.12.5", features = ["test"] }

[build-dependencies]
tauri-build = "=2.7.4"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
