[package]
name = "stoneql-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "stoneql_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
stoneql-runtime = { path = "../../../crates/stoneql-runtime", default-features = false }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
stoneql-core = { path = "../../../crates/stoneql-core" }
stoneql-contracts = { path = "../../../crates/stoneql-contracts" }
serde_json.workspace = true
serde.workspace = true
uuid.workspace = true
tokio.workspace = true
# A20 GZIP export (approved 2026-11-17); pure-Rust backend, already in the lockfile.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# Clears the master password and the vault key from memory; already in the lockfile.
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

# D005 desktop secret providers: macOS Keychain; Windows DPAPI-encrypted files; Linux below.
# Other OSes are explicitly unsupported.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", default-features = false }
[target.'cfg(windows)'.dependencies]
stoneql-dpapi = { path = "../../../crates/stoneql-dpapi" }

# Linux: the Secret Service over libdbus (D005) and WebKitGTK's web-process-terminated signal
# (F-2). Both are already in the lockfile through tao/wry; no extra features (v2_xx would raise
# the WebKitGTK floor above wry's own).
[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "=0.9.12", default-features = false }
webkit2gtk = { version = "=2.0.2", default-features = false }
# Encrypted file vault, used only without a Secret Service (approved 2026-11-17): RustCrypto
# AES-256-GCM and Argon2id, OS randomness, and descriptor-relative file access like the journal.
# All already in the lockfile (russh, ssh-key, uuid, stoneql-runtime).
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc"] }
getrandom = { version = "=0.4.3", default-features = false }
nix = { version = "=0.31.3", default-features = false, features = ["fs", "user"] }

[dev-dependencies]
sqlx = { workspace = true, features = ["sqlite"] }
tauri = { version = "=2.12.5", features = ["test"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
# Live SQLite files (A5): excluded from release builds; tests enable it for the regressions.
sqlite = ["stoneql-runtime/sqlite"]
# Compiles the `--smoke-test` startup probe into an optimized build for the release startup
# profile (`npm run desktop:profile`). Never enabled for the shipped release.
smoke = []

[lints]
workspace = true

# Opens a real window; runs only with STONEQL_REAL_WINDOW=1 (see the file header).
[[test]]
name = "real_window_reload"
harness = false
required-features = ["sqlite"]

[[test]]
name = "reload_guard"
required-features = ["sqlite"]

[[test]]
name = "sqlite_database"
required-features = ["sqlite"]

[[test]]
name = "sqlite_execution"
required-features = ["sqlite"]

[[example]]
name = "journal_window"
required-features = ["sqlite"]
