[package]
name = "stoneql-receive-limit-evaluation"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

# Separate test harness sharing the approved, provenance-checked source.
[workspace]

[dependencies]
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "mysql"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[patch.crates-io]
sqlx-mysql = { path = "../../vendor/sqlx-mysql" }
