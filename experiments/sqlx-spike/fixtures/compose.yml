services:
  mysql:
    image: mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
    environment:
      MYSQL_ROOT_PASSWORD: ${STONEQL_FIXTURE_PASSWORD:?generated by runner}
      MYSQL_DATABASE: stoneql_m001_fixture
    ports: ["127.0.0.1::3306"]
    volumes: ["${STONEQL_FIXTURE_INIT:?generated by runner}:/docker-entrypoint-initdb.d:ro"]
    tmpfs: [/var/lib/mysql]
    mem_limit: 1g
  mariadb:
    image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
    environment:
      MARIADB_ROOT_PASSWORD: ${STONEQL_FIXTURE_PASSWORD:?generated by runner}
      MARIADB_DATABASE: stoneql_m001_fixture
    ports: ["127.0.0.1::3306"]
    volumes: ["${STONEQL_FIXTURE_INIT:?generated by runner}:/docker-entrypoint-initdb.d:ro"]
    tmpfs: [/var/lib/mysql]
    mem_limit: 1g
  postgresql:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_PASSWORD: ${STONEQL_FIXTURE_PASSWORD:?generated by runner}
      POSTGRES_USER: stoneql_fixture
      POSTGRES_DB: stoneql_m001_fixture
    ports: ["127.0.0.1::5432"]
    volumes: ["${STONEQL_FIXTURE_INIT:?generated by runner}:/docker-entrypoint-initdb.d:ro"]
    tmpfs: [/var/lib/postgresql/data]
    mem_limit: 512m
networks:
  default: {}
