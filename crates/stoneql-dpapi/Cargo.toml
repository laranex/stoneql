[package]
name = "stoneql-dpapi"
description = "Windows DPAPI (current-user) protect/unprotect: the workspace's only unsafe code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Not `workspace = true`: the workspace forbids unsafe code, and this crate is the one reviewed
# exception (approved 2026-11-17). Unsafe stays denied except on the two FFI functions below.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "deny"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography"] }
