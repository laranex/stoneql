[package]
name = "stoneql-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
stoneql-core = { path = "../stoneql-core" }
stoneql-contracts = { path = "../stoneql-contracts" }
futures-util.workspace = true
serde_json.workspace = true
# Runtime drivers are isolated here, never in core/contracts or host adapters.
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "mysql", "postgres", "sqlite"] }
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util"] }

[lints]
workspace = true

[[example]]
name = "lifecycle"
test = true
