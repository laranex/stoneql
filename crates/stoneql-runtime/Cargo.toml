[package]
name = "stoneql-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
stoneql-core = { path = "../stoneql-core" }
stoneql-contracts = { path = "../stoneql-contracts" }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
# Runtime drivers are isolated here, never in core/contracts or host adapters.
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "mysql", "postgres"] }
tokio = { workspace = true, features = ["net", "io-util"] }
uuid.workspace = true
# SSH transport (D016): pure-Rust client, ring backend, no RSA (RUSTSEC-2023-0071 is unpatched).
russh = { version = "=0.64.1", default-features = false, features = ["ring"] }

[target.'cfg(unix)'.dependencies]
# Durable outcome journal: descriptor-relative, no-follow file operations without `unsafe`.
# Already in the lockfile (via the Tauri stack); `fs`/`dir`/`user` add no crates.
nix = { version = "=0.31.3", default-features = false, features = ["fs", "dir", "user"] }

[features]
# SQLite (bundled libsqlite3) is out of the release scope (A5, 2026-11-16): the desktop release
# build depends on this crate without default features. Kept for regression tests.
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util"] }

[lints]
workspace = true

[[example]]
name = "lifecycle"
test = true

[[example]]
name = "journal_crash"
required-features = ["sqlite"]
