name: Rust foundation
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: npm ci
      - run: npm run build
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: npm run rust:vendor
      - run: npm run rust:fmt
      - run: npm run rust:build
      - run: npm run rust:lint
      - run: npm run rust:test
      - run: npm run rust:boundaries
      - run: npm run contracts:check
      - run: node --test tests/workspace.test.mjs tests/driver-fixtures.test.mjs
      - if: runner.os == 'Linux'
        run: npm test
      - if: runner.os == 'Linux'
        run: cargo install cargo-audit --version 0.22.2 --locked
      # The shipped graph (macOS release targets) must be advisory-free; this gates the build.
      - if: runner.os == 'Linux'
        run: npm run audit:release
      # The full graph also covers development-only SQLite and the unreleased Linux GTK stack.
      # Its advisories stay visible here (A4: never ignored) without blocking.
      - if: runner.os == 'Linux'
        continue-on-error: true
        run: cargo audit --deny warnings
      - if: runner.os == 'Linux'
        run: npm run spike:drivers
      - if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: m001-driver-observations
          path: artifacts/m001/
          if-no-files-found: ignore
          retention-days: 7
