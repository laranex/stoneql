name: Bug report
description: Something in StoneQL does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not include passwords, keys or production data.** Security problems go to the [security policy](https://github.com/stoneAce/stoneql/security/policy) instead.
  - type: input
    id: version
    attributes:
      label: StoneQL version
      placeholder: 0.1.0-beta.1
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 27.0.1, Apple Silicon
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Database engine
      options: [MySQL, MariaDB, PostgreSQL, Not database-related]
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Connection type
      options: [Direct, SSH tunnel, Not connection-related]
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact message StoneQL showed, if any.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
