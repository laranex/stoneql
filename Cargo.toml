[workspace]
resolver = "3"
members = ["crates/dbadmin-core", "crates/dbadmin-contracts", "experiments/sqlx-spike", "apps/desktop/src-tauri", "crates/dbadmin-runtime"]
default-members = ["crates/dbadmin-core", "crates/dbadmin-contracts"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
ts-rs = "=12.0.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "mysql", "postgres", "sqlite", "bigdecimal"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
futures-util = "=0.3.34"
bigdecimal = "=0.4.9"
url = "=2.5.7"
uuid = { version = "=1.29.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
